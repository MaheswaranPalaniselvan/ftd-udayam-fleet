name: Udayam Fleet Worker

on:
  # Automated schedule disabled to preserve GitHub Actions minute quota
  # schedule:
  #   - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of parallel GitHub worker instances (1-10)'
        required: true
        default: '10'
        type: choice
        options:
          - '2'
          - '3'
          - '5'
          - '8'
          - '10'
      state:
        description: 'Target State prefix filter (e.g. TN, KL - leave blank for any)'
        required: false
        default: ''
      district:
        description: 'Target District code (e.g. TN-02 - leave blank for auto)'
        required: false
        default: ''
      max_districts:
        description: 'Maximum districts per worker before stopping'
        required: true
        default: '1'
      max_duration_minutes:
        description: 'Max run time per worker in minutes'
        required: true
        default: '120'
      rerun_type:
        description: 'Rerun failed or missing records (none, failed, missing, all)'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'failed'
          - 'missing'
          - 'all'

concurrency:
  group: udayam-worker-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.set-matrix.outputs.workers }}
    steps:
      - id: set-matrix
        run: |
          COUNT="${{ inputs.workers || '10' }}"
          python3 -c "import json, sys; count=int(sys.argv[1]); print('workers=' + json.dumps([str(i) for i in range(1, count + 1)]))" "$COUNT" >> "$GITHUB_OUTPUT"

  run-worker:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.prepare-matrix.outputs.workers) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install System Dependencies for OCR & Native Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev libgomp1
          # Dual-support for Debian/Ubuntu (t64 transition in Ubuntu 24.04 noble)
          sudo apt-get install -y libglib2.0-0t64 || sudo apt-get install -y libglib2.0-0 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Sync Project Dependencies
        run: uv sync

      - name: Install Playwright Chromium with dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run Udayam Scraper Worker
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        run: |
          MACHINE_NAME="GitHub-Worker-${{ matrix.worker_id }}-${{ github.run_id }}"
          STATE_FLAG=""
          DIST_FLAG=""
          RERUN_FLAG=""

          if [ -n "${{ inputs.state }}" ]; then
            STATE_FLAG="--state ${{ inputs.state }}"
          fi

          if [ -n "${{ inputs.district }}" ]; then
            DIST_FLAG="--district ${{ inputs.district }}"
          fi

          if [ -n "${{ inputs.rerun_type }}" ] && [ "${{ inputs.rerun_type }}" != "none" ]; then
            RERUN_FLAG="--rerun-type ${{ inputs.rerun_type }}"
          fi

          MAX_DIST="${{ inputs.max_districts || '1' }}"
          MAX_TIME="${{ inputs.max_duration_minutes || '120' }}"

          # Random jitter (1-20s) to stagger coordinator API requests across parallel workers
          JITTER=$(( (RANDOM % 20) + 1 ))
          echo "Staggering worker startup by ${JITTER}s..."
          sleep $JITTER

          echo "Starting worker: $MACHINE_NAME"
          uv run python client/app.py \
            --cli \
            --machine "$MACHINE_NAME" \
            --concurrency 2 \
            --max-districts "$MAX_DIST" \
            --max-duration-minutes "$MAX_TIME" \
            $STATE_FLAG $DIST_FLAG $RERUN_FLAG


