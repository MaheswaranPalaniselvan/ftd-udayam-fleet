name: Deploy Coverage Dashboard to GitHub Pages (PAUSED - Quota Preserved)

on:
  # Automated triggers paused - representation moved to Cloudflare Pages (free unlimited bandwidth & zero Actions quota)
  # push:
  #   branches:
  #     - master
  #     - main

  # workflow_run:
  #   workflows: ["Udayam Fleet Worker"]
  #   types:
  #     - completed

  # schedule:
  #   - cron: '30 */6 * * *'

  # Manual trigger only (if ever needed)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Dependencies
        run: uv sync

      - name: Build GitHub Pages Dashboard
        run: |
          uv run python build_github_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

